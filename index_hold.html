<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="臺灣醫院護理師工作滿意度調查，預計於2026年11月6日開放填答。">
  <meta name="theme-color" content="#065f46">
  <title>即將開放填答｜臺灣醫院護理師工作滿意度調查</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#ecfdf5;color:#1f2937;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8}
    header{background:linear-gradient(110deg,#065f46,#0f766e);color:#fff;box-shadow:0 4px 10px #064e3b18}
    header div{max-width:896px;margin:auto;padding:20px 24px;font-size:clamp(18px,3.5vw,24px);font-weight:700}
    main{max-width:760px;margin:64px auto;padding:0 20px}
    .card{background:white;padding:48px 36px;text-align:center;border-top:8px solid #059669;border-radius:24px;box-shadow:0 12px 30px #064e3b12}
    .icon{display:grid;place-items:center;width:88px;height:88px;margin:0 auto 24px;border-radius:50%;background:#d1fae5;color:#059669}
    .badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:100px;padding:5px 18px;font-weight:700;font-size:14px}
    h1{color:#064e3b;font-size:clamp(26px,5vw,36px);margin:18px 0 10px}
    p{margin:12px 0;color:#4b5563}
    
    /* 突顯「暫停開放」提示區塊的 CSS */
    .notice-alert {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      color: #991b1b;
      font-size: 18px;
    }
    .notice-alert strong {
      color: #dc2626;
      font-size: 20px;
    }

    .date{margin:28px 0;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:16px;padding:22px 16px}
    .date span{display:block;color:#047857;font-size:15px}
    .date strong{display:block;color:#065f46;font-size:clamp(24px,5vw,32px)}
    .note{font-size:15px}
    .contact{border-top:1px solid #e5e7eb;margin-top:30px;padding-top:22px;font-size:14px;color:#6b7280}
    .contact p{margin:4px 0;color:inherit}
    a{color:#047857;text-underline-offset:3px}
    footer{text-align:center;padding:0 20px 30px;font-size:13px;color:#6b7280}
    @media(max-width:480px){main{margin:32px auto}.card{padding:32px 22px}header div{padding:16px 20px}}
  </style>
</head>
<body>
  <header><div>臺灣醫院護理師工作滿意度調查</div></header>
  <main>
    <section class="card" aria-labelledby="notice-title">
      <div class="icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M9 16l2 2 4-4"/></svg></div>
      <span class="badge">問卷即將開放</span>
      <h1 id="notice-title">感謝您的關心與支持</h1>
      
      <!-- 修改處：將原段落加入顯眼的警告樣式與加粗醒目標示 -->
      <div class="notice-alert">
        親愛的護理同仁您好：<br>
        <strong>本問卷因故暫停開放填答，敬請稍候。</strong>
      </div>

      <p>本次調查將了解護理師的<strong>工作滿意度與留任意願</strong>，<br>您的寶貴意見將作為改善護理職場的重要參考。</p>
      <p class="note">預估填答時間約 <strong>10–15 分鐘</strong>。<br>請於開放後，依研究團隊提供的問卷連結進入填答。</p>
      <div class="contact">
        <p>中華民國護理師護士公會全國聯合會 — 職場研究小組</p>
        <p>電話：<a href="tel:0225502283">(02)2550-2283</a> 分機 14</p>
        <p>電子郵件：<a href="mailto:lan@nurse.org.tw">lan@nurse.org.tw</a></p>
      </div>
    </section>
  </main>
  <footer>感謝您為護理職場的改善共同發聲。</footer>
  <!-- 公告頁 v1.0.0｜2026-11-04；本頁不收集資料，不會自動切換為正式問卷。 -->
</body>
</html>
