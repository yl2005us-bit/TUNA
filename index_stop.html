<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣醫院護理師工作滿意度調查 - 停止收案公告</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff; /* 淺藍色背景 */
        }
        .gradient-header {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); /* 專業的 teal 色調 */
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden transform transition-all hover:shadow-3xl">
        
        <!-- Header Section -->
        <header class="gradient-header text-white p-8 text-center relative overflow-hidden">
            <!-- Decorative Background Elements -->
            <div class="absolute top-0 left-0 w-full h-full opacity-10">
                <i class="fa-solid fa-heart-pulse text-9xl absolute -top-10 -left-10 transform rotate-12"></i>
                <i class="fa-solid fa-user-nurse text-9xl absolute bottom-0 right-0 transform -rotate-12"></i>
            </div>

            <div class="relative z-10">
                <div class="inline-block bg-white/20 backdrop-blur-sm px-4 py-1 rounded-full text-sm font-medium mb-4 border border-white/30">
                    第一階段公告
                </div>
                <h1 class="text-2xl md:text-3xl font-bold mb-2 tracking-wide leading-tight">
                    臺灣醫院護理師<br>工作滿意度調查
                </h1>
            </div>
        </header>

        <!-- Content Section -->
        <div class="p-8 md:p-10 text-center space-y-6">
            
            <!-- Status Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-24 h-24 bg-teal-50 rounded-full flex items-center justify-center animate-float">
                    <i class="fa-solid fa-clipboard-check text-5xl text-teal-600"></i>
                </div>
            </div>

            <!-- Main Message -->
            <div>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    感謝親愛的護理同仁<br>熱情回應！
                </h2>
                
                <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r text-left mx-auto max-w-lg mb-6 shadow-sm">
                    <p class="text-gray-700 font-medium flex items-start">
                        <i class="fa-solid fa-circle-info text-amber-500 mt-1 mr-3 flex-shrink-0"></i>
                        <span>本年度收案已達計畫目標，我們已<strong class="text-amber-700">於2026年2月8日起停止收案</strong>！</span>
                    </p>
                </div>

                <p class="text-gray-600 leading-relaxed text-lg">
                    感謝您對護理專業與環境改善的支持！<br>
                    您的每一份意見都是我們進步的動力。
                </p>
            </div>
        </div>

        <!-- Contact Section -->
        <footer class="bg-gray-50 border-t border-gray-100 p-8">
            <h3 class="text-center text-gray-500 text-sm font-semibold uppercase tracking-wider mb-6">
                研究團隊聯繫資訊
            </h3>

            <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
                <!-- Organization Info -->
                <div class="text-center md:text-left">
                    <p class="font-bold text-gray-800 text-lg flex items-center justify-center md:justify-start gap-2">
                        <i class="fa-solid fa-building-columns text-teal-600"></i>
                        中華民國護理師護士公會全國聯合會
                    </p>
                    <p class="text-gray-500 text-sm pl-0 md:pl-7 mt-1">職場研究小組</p>
                </div>
            </div>
            
            <div class="mt-6 flex flex-col sm:flex-row gap-4 justify-center">
                <!-- Phone -->
                <a href="tel:0225502283" class="flex items-center justify-center gap-3 px-5 py-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-teal-500 hover:text-teal-600 transition-colors group">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-teal-50">
                        <i class="fa-solid fa-phone text-gray-500 group-hover:text-teal-600 text-sm"></i>
                    </div>
                    <span class="font-medium text-gray-700">(02)2550-2283 <span class="text-xs text-gray-400">#14</span></span>
                </a>

                <!-- Email -->
                <button onclick="copyEmail()" class="flex items-center justify-center gap-3 px-5 py-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-teal-500 hover:text-teal-600 transition-colors group cursor-pointer relative">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center group-hover:bg-teal-50">
                        <i class="fa-solid fa-envelope text-gray-500 group-hover:text-teal-600 text-sm"></i>
                    </div>
                    <span class="font-medium text-gray-700">lan@nurse.org.tw</span>
                    
                    <!-- Tooltip -->
                    <span id="copyTooltip" class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs py-1 px-2 rounded opacity-0 transition-opacity">已複製</span>
                </button>
            </div>
        </footer>
        
        <!-- Decorative Footer Line -->
        <div class="h-2 w-full bg-gradient-to-r from-teal-500 to-emerald-500"></div>
    </main>

    <script>
        function copyEmail() {
            const email = "lan@nurse.org.tw";
            
            // Create temporary element to copy text
            const tempInput = document.createElement("input");
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // Show feedback
            const tooltip = document.getElementById('copyTooltip');
            tooltip.classList.remove('opacity-0');
            
            // Change button style temporarily
            setTimeout(() => {
                tooltip.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
